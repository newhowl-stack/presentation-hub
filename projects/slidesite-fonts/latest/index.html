window.SLS_STYLE_GUIDE="# SLS Style Format Guide \u2014 experimental 2.7 overlay fork\n\nThis guide describes the style fields supported by this standalone SlideSite editor. It is for an LLM preparing deck model changes. It also defines the limited declarative design JSON import supported by the overlay fork.\n\nThe embedded `deck-source` JSON is the semantic source of truth. Preserve `deck_id`, slide/object IDs, content, geometry, assets, safety metadata and per-object `style_overrides`. Supply valid CSS color values for the current `theme.tokens` keys (`background`, `soft`, `text`, `accent`, and any other keys already present). Use system font family names in `theme.fontRoles` (`display`, `body`, `mono`) and include families in `fonts`. Object `style_bindings` connect properties such as color and family to these roles. Existing `style_overrides` indicate deliberate individual choices; do not discard them during a global style change.\n\nA minimal style proposal, to be applied by a compatible editor or by carefully updating a copy of the deck model:\n\n```json\n{\n  \"name\": \"Blue\",\n  \"tokens\": {\"background\":\"#ffffff\",\"soft\":\"#edf2ff\",\"text\":\"#182b49\",\"accent\":\"#315bde\"},\n  \"fonts\": {\"display\":\"Arial\",\"body\":\"Arial\",\"mono\":\"monospace\"}\n}\n```\n\nMatch the complete token set and current role keys of the actual deck when editing; the four tokens above are illustrative, not a complete schema for every deck. A design choice may provide multiple background choices through existing slide background bindings. Validate values against the trusted editor's palette and normalization, preview before applying, and verify slide contrast. Keep style definitions declarative: no scripts, network dependencies, event handlers or arbitrary HTML. The Graphic Design overlay accepts validated local SLS HTML from the same runtime and declarative design JSON. Layout definitions are separate from graphic designs and carry geometry/role placements, not text or image content.\n\n## Overlay fork 2.7.0 \u2014 locally importable design JSON\n\nThe current overlay fork accepts a declarative JSON file with `format: \"sls-graphic-design/1\"`, or a standalone SLS HTML generated by the same trusted runtime. JSON imports may contain `name`, `description`, `vibes`, `tokens`, and `fonts`. The five required hex tokens are `background`, `text`, `muted`, `accent`, and `soft`. Each font role (`display`, `body`, `mono`) must be one of Arial, Georgia, Verdana, Trebuchet MS, or monospace. Layout geometry, slide content, HTML, CSS and scripts do not belong in this package. Imported designs are stored within this SLS file and are not shared across an account.\n\n```json\n{\n  \"format\":\"sls-graphic-design/1\",\n  \"name\":\"Studio blue\",\n  \"description\":\"Clear blue presentation style\",\n  \"vibes\":[\"Corporate\",\"Minimal\"],\n  \"tokens\":{\"background\":\"#FFFFFF\",\"text\":\"#182B49\",\"muted\":\"#52627A\",\"accent\":\"#315BDE\",\"soft\":\"#EDF2FF\"},\n  \"fonts\":{\"display\":\"Arial\",\"body\":\"Arial\",\"mono\":\"monospace\"}\n}\n```\n\nThe standalone New Presentation ZIP includes `starter.html` (the current editor runtime and a deterministic slide skeleton), `brief.json`, `brief.md`, this guide and any supplied assets. An external LLM should infer each slide type and compatible layout from summary, section name and slide headline, then update the structured model. It should preserve IDs, content, local overrides and safety rules. The offline editor itself uses narrow title rules and Explanation for ambiguous names; it does not claim LLM inference.\n";

    panel.querySelector('.sls-font-choose').onclick=()=>picker.click();picker.onchange=()=>choose(picker.files[0]);
    drop.ondragover=e=>{e.preventDefault();drop.classList.add('is-over');};drop.ondragleave=()=>drop.classList.remove('is-over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('is-over');choose(e.dataTransfer?.files?.[0]);};
    panel.querySelector('.sls-font-back').onclick=()=>this.openFontChoices(anchor);
    panel.querySelector('.sls-font-add').onclick=async()=>{const name=safeName(panel.querySelector('.sls-font-name').value),file=chosen,weight=Number(panel.querySelector('.sls-font-weight').value),style=panel.querySelector('.sls-font-style').value;
      try{if(!validName(name))throw Error('Enter a valid font family name.');if(!file)throw Error('Choose a font file.');if(!panel.querySelector('.sls-font-confirm input').checked)throw Error('Confirm your font redistribution rights first.');
        const ext=file.name.split('.').pop().toLowerCase();if(!mime[ext])throw Error('Choose a WOFF2, WOFF, TTF or OTF font.');if(file.size>5*1024*1024)throw Error('This font exceeds the 5 MB per-face limit.');
        const bytes=new Uint8Array(await file.arrayBuffer());if(!signature(bytes,ext))throw Error('The file does not match its font format.');
        const data=`data:${mime[ext]};base64,${bytesToBase64(bytes)}`;
        const test=new FontFace(name,`url("${data}")`,{weight:String(weight),style});await test.load();
        this.transaction('embed font',()=>{this.model.font_faces ||= {};const current=this.model.font_faces[name];const existing=Array.isArray(current)?current:current?[{data:current,weight:400,style:'normal'}]:[];this.model.font_faces[name]=existing.filter(f=>!(Number(f.weight)===weight&&(f.style||'normal')===style)).concat({data,weight,style});this.model.fonts=[...new Set([...(this.model.fonts||[]),name])];},{full:true});
        this.refreshFontFaces();this.openFontChoices(anchor,`${name} added. Select it below to apply it to text.`);
      }catch(error){status.textContent=error.message;}
    };
  };
  P.action=function(action,anchor){if(action==='ux-font')return this.openFontChoices(anchor);return previousAction.call(this,action,anchor);};
})();
